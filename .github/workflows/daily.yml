name: Daily YouTube Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create config from secrets
        run: |
          echo '${{ secrets.CONFIG_JSON }}' > config.json
      
      - name: Run main script
        run: python main.py
      
      - name: Commit processed videos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add processed_videos.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update processed videos"
          git push || true
